<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>{{ title or "ghostty-web-nu sessions" }}</title>
  <script type="module" src="{{ datastar_js_path }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"></script>
  <script type="module" src="/key-buffer.js"></script>
  <link rel="stylesheet" href="/stellar.css">
  <link rel="stylesheet" href="/md.css">
  <link rel="stylesheet" href="/grid.css">
  <style>
    :root {
      --bg: #1d0e2e; --fg: #d4d4d4;
      --pane: #161616; --pane-border: #2a2a2a;
      --sel: #2a9d4a; --sel-fg: #ffffff; --dim: #888;
      --chrome: #252525;
    }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px var(--term-font); }
    body { display: grid; grid-template-columns: 14rem 1fr auto; height: 100dvh; }
    aside { background: var(--pane); border-right: 1px solid var(--pane-border); overflow-y: auto; min-height: 0; }
    aside header { padding: .4rem .5rem .4rem .75rem; border-bottom: 1px solid var(--pane-border); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; justify-content: space-between; }
    aside header .new-btn { background: transparent; color: inherit; border: 1px solid var(--pane-border); border-radius: 3px; padding: 0 .5rem; font: inherit; cursor: pointer; line-height: 1.4; }
    aside header .new-btn:hover { background: #222; color: var(--fg); }
    aside ul { list-style: none; margin: 0; padding: 0; }
    aside li { display: flex; align-items: stretch; border-bottom: 1px solid var(--pane-border); }
    aside li .row { flex: 1; min-width: 0; text-align: left; background: transparent; color: inherit; border: 0; padding: .4rem .75rem; font: inherit; cursor: pointer; overflow: hidden; }
    aside li .row:hover { background: #222; }
    aside li.selected .row { background: var(--sel); color: var(--sel-fg); }
    aside li .close { flex: 0 0 auto; width: 1.75rem; background: transparent; color: inherit; border: 0; padding: 0; font: inherit; cursor: pointer; opacity: 0; transition: opacity .1s; }
    aside li:hover .close, aside li.selected .close { opacity: .6; }
    aside li .close:hover { opacity: 1; color: #ff7676; background: #222; }
    aside li .copy { flex: 0 0 auto; width: 1.75rem; display: flex; align-items: center; justify-content: center; background: transparent; color: inherit; border: 0; padding: 0; font: inherit; cursor: pointer; opacity: 0; transition: opacity .1s; }
    aside li:hover .copy, aside li.selected .copy { opacity: .6; }
    aside li .copy:hover { opacity: 1; background: #222; }
    aside li .copy iconify-icon { font-size: 13px; }
    aside li .copy.copied { opacity: 1; color: var(--sel); }
    aside li small { display: block; font-size: 11px; opacity: .6; }
    /* main is a grid: topbar | (terminal + rightbar) | statusbar. */
    main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; overflow: hidden; }
    .topbar {
      background: var(--chrome); padding: .15rem .75rem;
      display: flex; align-items: center;
      font-size: 11px; color: var(--dim);
    }
    .title-display { cursor: pointer; padding: 0 .25rem; border-radius: 2px; }
    .title-display:hover { background: #2f2f2f; color: var(--fg); }
    .middle { display: grid; grid-template-columns: 1fr 1ch; min-height: 0; }
    /* Continuous document: every session's terminal stacked vertically, the
       whole column scrolls. Each .pane is a fixed-height live terminal whose
       grid.css #screen-<sid> fills the .pane-screen below its header. */
    #doc { min-height: 0; overflow-y: auto; overflow-x: hidden; padding: .5rem; display: flex; flex-direction: column; gap: .5rem; }
    .pane { flex: 0 0 auto; display: flex; flex-direction: column; border: 1px solid var(--pane-border); border-radius: 4px; overflow: hidden; background: var(--term-bg); transition: opacity .12s, border-color .12s; scroll-margin: .5rem; }
    .pane-head { flex: 0 0 auto; padding: .15rem .6rem; font-size: 11px; color: var(--dim); background: var(--chrome); cursor: pointer; display: flex; gap: .5ch; align-items: baseline; }
    .pane-head small { opacity: .5; }
    /* The terminal viewport. terminal.js sets its height to the row count it
       wants (fixedRows * cell height), so the pane sizes itself -- no calc,
       no absolute positioning. Scrollback scrolls within this box. */
    .pane-screen { flex: 0 0 auto; overflow-y: auto; overflow-x: hidden; background: var(--term-bg); }
    /* The active (selected) pane is highlighted. In navigate mode every pane
       is dimmed (read-only); focus mode lights the active one fully. */
    .pane.active { border-color: var(--sel); }
    body.mode-navigate .pane { opacity: .3; }
    body.mode-navigate .pane.active { opacity: .55; }
    body.mode-focus .pane { opacity: .4; }
    body.mode-focus .pane.active { opacity: 1; }
    .mode-badge { margin-left: auto; font-size: 11px; color: var(--dim); letter-spacing: .04em; text-transform: uppercase; }
    body.mode-focus .mode-badge { color: var(--sel); }
    .rightbar { background: var(--chrome); }
    .statusbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2.5rem 1rem .75rem;
      background: var(--chrome); color: var(--fg);
      border-top: 1px solid var(--pane-border);
      font-size: 11px; line-height: 1;
      font-family: var(--term-font);
    }
    /* Right-side canvas pane. Lives in body's third grid column (`auto`), so
       when :empty the column collapses to 0 and the terminal gets full width.
       Server pushes content via the same /sse stream (canvas.events). */
    .canvas {
      position: relative;
      width: var(--canvas-w, 32rem); min-height: 0; overflow: auto;
      background: var(--pane); border-left: 1px solid var(--pane-border);
      padding: .75rem; box-sizing: border-box;
      font-size: 12px;
    }
    .canvas:empty { display: none; }
    .canvas pre { margin: 0; white-space: pre; }
    .canvas-resizer {
      position: absolute; left: -3px; top: 0; bottom: 0; width: 6px;
      cursor: col-resize; background: transparent;
      transition: background .15s;
    }
    .canvas-resizer:hover, body.canvas-dragging .canvas-resizer { background: var(--sel); }
    .canvas-content { height: 100%; }
    body.canvas-dragging { user-select: none; cursor: col-resize; }
    body.canvas-dragging .term-wrap, body.canvas-dragging .canvas-content { pointer-events: none; }

    /* Rename modal. */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0, 0, 0, 0.45);
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 6rem;
    }
    .modal-box {
      width: min(28rem, 90%);
      background: var(--pane);
      border: 1px solid var(--pane-border);
      border-radius: 4px;
      padding: .75rem 1rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .modal-heading {
      font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--dim); margin-bottom: .35rem;
    }
    .modal-input {
      width: 100%; background: transparent; border: 0; outline: none;
      color: var(--fg); font: inherit; font-size: 14px;
      padding: .25rem 0;
    }
  </style>
</head>
<body
  data-signals='{"selectedSid":"","connId":"","sid":"","sel":"","termCols":0,"termRows":0,"termTitle":"","title":{{ title | default("") | tojson | e }},"docReady":false,"renaming":false,"renameMode":"title","draft":"","label":""}'
  data-init="@get('/sse')"
  data-effect="document.title = $title || 'ghostty-web-nu sessions'"
  data-actions='{
    "new":       "window.app.newSession()",
    "close":     "window.app.closeSelected()",
    "next":      "window.app.cycle(1)",
    "prev":      "window.app.cycle(-1)",
    "rename":    "window.app.openRename()",
    "renameTab": "window.app.openRenameTab()",
    "focus":     "window.app.focus()"
  }'
  data-keymap='{
    "enter": "focus",
    "alt+t": "new",
    "alt+d": "close",
    "alt+j": "next",
    "alt+k": "prev",
    "alt+r": "renameTab",
    "alt+shift+r": "rename"
  }'
>
  <!-- Server overwrites this on every event. -->
  <aside id="sessions-list"><header>Sessions</header></aside>

  <main>
    <div class="topbar">
      <span
        class="title-display"
        title="Rename (Alt+Shift+R)"
        data-text="$title || 'untitled'"
        data-on:click="$draft = $title; $renameMode = 'title'; $renaming = true"></span>
      <span class="mode-badge" id="mode-badge">navigate</span>
    </div>
    <!-- Continuous document of session panes. The server fills #doc on init
         and appends/removes panes as sessions come and go; each pane opens
         its own view stream and mounts terminal.js. Selection highlight is
         reactive via data-class on $selectedSid. -->
    <div id="doc" class="doc"></div>
    <footer class="statusbar" aria-label="Status">
      <span data-text="$selectedSid ? ('sid ' + $selectedSid.slice(0,8)) : ''"></span>
    </footer>
  </main>

  <!-- Scroll the active pane into view (stacks-style offset) whenever the
       selection changes. Lives in the static shell so the server never
       morphs it away; data-effect fires on $selectedSid change. -->
  <!-- Lead with a bare $selectedSid read so Datastar registers it as a
       dependency even on the first eval, when the deferred module hasn't
       defined window.__onSelect yet (a `&&` guard would short-circuit
       before $selectedSid is read, and the effect would never re-run). -->
  <div data-effect="$selectedSid; window.__onSelect && window.__onSelect($selectedSid)" style="display:none"></div>

  <!-- Server-pushed canvas pane. Empty -> collapses to 0 width. -->
  <section id="canvas" class="canvas"></section>

  <!-- Hidden trigger so the JS-only Alt+R action can seed signals through
       datastar's expression evaluator. -->
  <button
    id="rename-tab-trigger"
    type="button"
    hidden
    data-on:click="$draft = el.dataset.label || ''; $renameMode = 'tab'; $renaming = true"></button>

  <!-- Rename modal. -->
  <div class="modal-backdrop" data-show="$renaming" data-on:click="$renaming = false">
    <div class="modal-box" data-on:click="evt.stopPropagation()">
      <div class="modal-heading" data-text="$renameMode === 'tab' ? 'Rename tab' : 'Rename window'"></div>
      <input
        type="text"
        class="modal-input"
        spellcheck="false"
        aria-label="rename"
        data-bind="draft"
        data-effect="$renaming && requestAnimationFrame(() => { el.focus(); el.setSelectionRange(0, el.value.length); })"
        data-on:keydown="if (evt.key === 'Enter') { if ($renameMode === 'tab') { $label = $draft; $renaming = false; @post('/pty/label') } else { $title = $draft; $renaming = false; @post('/title') } } else if (evt.key === 'Escape') { $renaming = false }">
    </div>
  </div>

  <key-buffer data-attr:sid="$selectedSid"></key-buffer>

  <script type="module">
    import { ensureTermFont, mountTerminal } from './terminal.js';
    await ensureTermFont();

    // Restore the canvas width set by the last drag.
    {
      const w = localStorage.getItem('canvas-w');
      if (w) document.body.style.setProperty('--canvas-w', w);
    }

    const doc = document.getElementById('doc');
    const PANE_ROWS = 24;

    // Mount terminal.js on each pane as the server appends it; tear down on
    // removal. Each pane is a fixed PANE_ROWS-tall live terminal sized to
    // the document width. Resizing a pane POSTs /pty/resize for its sid.
    const mounted = new Map(); // sid -> terminal handle
    function mountPane(pane) {
      const sid = pane.dataset.sid;
      if (!sid || mounted.has(sid)) return;
      const screen = pane.querySelector('.pane-screen');
      const grid = pane.querySelector('[id^="grid-"]');
      if (!screen || !grid) return;
      const term = mountTerminal({
        screen,
        grid,
        fixedRows: PANE_ROWS,
        onResize: (cols, rows) => {
          fetch('/pty/resize?sid=' + encodeURIComponent(sid), {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ cols, rows }),
          }).catch(() => {});
        },
      });
      mounted.set(sid, term);
      // Size the pty to the pane now that it's measured.
      term.syncNow();
    }
    function scanPanes() {
      doc.querySelectorAll('.pane').forEach(mountPane);
      // Drop handles for panes the server removed.
      for (const sid of [...mounted.keys()]) {
        if (!doc.querySelector('#pane-' + CSS.escape(sid))) mounted.delete(sid);
      }
    }
    new MutationObserver(scanPanes).observe(doc, { childList: true });
    scanPanes();

    // Sidebar copy-sid button (delegated; rows are re-rendered by datastar).
    document.addEventListener('click', (e) => {
      const btn = e.target instanceof HTMLElement ? e.target.closest('.copy') : null;
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      const sid = btn.dataset.sid || '';
      if (!sid) return;
      navigator.clipboard?.writeText(sid).then(() => {
        btn.classList.add('copied');
        setTimeout(() => btn.classList.remove('copied'), 600);
      }).catch(() => {});
    });

    // Drag-to-resize the canvas pane (delegated; .canvas-resizer is
    // re-created on every #canvas patch).
    document.addEventListener('mousedown', (e) => {
      if (!(e.target instanceof HTMLElement) || !e.target.classList.contains('canvas-resizer')) return;
      e.preventDefault();
      document.body.classList.add('canvas-dragging');
      const onMove = (ev) => {
        const min = 12 * 16, maxTake = window.innerWidth - 24 * 16;
        const w = Math.max(min, Math.min(maxTake, window.innerWidth - ev.clientX));
        document.body.style.setProperty('--canvas-w', w + 'px');
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.body.classList.remove('canvas-dragging');
        const w = document.body.style.getPropertyValue('--canvas-w');
        if (w) localStorage.setItem('canvas-w', w);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    // Action registry. data-actions maps id -> JS, data-keymap maps combo ->
    // id. The capture-phase handler below evaluates the matched action's JS.
    window.app = {
      newSession() {
        document.querySelector('#sessions-list .new-btn')?.click();
      },
      closeSelected() {
        if (!currentSid()) return;
        fetch('/pty/close?sid=' + encodeURIComponent(currentSid()), { method: 'POST' }).catch(() => {});
      },
      cycle(dir) {
        const items = [...document.querySelectorAll('#sessions-list li')];
        if (!items.length) return;
        const idx = items.findIndex((li) => li.classList.contains('selected'));
        const next = items[((idx < 0 ? 0 : idx) + dir + items.length) % items.length];
        next.querySelector('.row')?.click();
      },
      openRename() {
        document.querySelector('.title-display')?.click();
      },
      openRenameTab() {
        const btn = document.querySelector('#sessions-list li.selected .row');
        if (!btn) return;
        const label = btn.firstChild?.textContent?.trim() ?? '';
        const trig = document.getElementById('rename-tab-trigger');
        if (!trig) return;
        trig.dataset.label = label;
        trig.click();
      },
      focus() {
        // Enter the focused terminal only if one is selected.
        if (currentSid()) setMode('focus');
      },
    };

    // The selected sid, read straight from the active pane (datastar sets
    // .active reactively from $selectedSid). Reading the DOM avoids any race
    // with caching the signal in JS. __onSelect (data-effect in the shell)
    // handles scroll + dropping focus when the selection empties.
    const currentSid = () => doc.querySelector('.pane.active')?.dataset.sid || '';
    window.__onSelect = (sid) => {
      if (sid) {
        // Reveal the selected pane's bottom -- a terminal's prompt and latest
        // output sit there. block:'end' aligns the pane's bottom to the
        // viewport bottom (shows the bottom even when the pane is taller than
        // the viewport); scroll-margin on .pane adds breathing room.
        const pane = doc.querySelector('#pane-' + CSS.escape(sid));
        if (pane) pane.scrollIntoView({ block: 'end' });
      }
      if (mode === 'focus' && !sid) setMode('navigate');
    };

    // Modal interaction: navigate vs focus. In navigate mode the terminal is
    // greyed and key-buffer is off, so the full keymap (Alt+T/D/J/K/R, Enter)
    // is live and nothing leaks to the pty. Enter focuses the selected
    // terminal -> key-buffer on, keys route to the pty, and only Alt+Esc
    // (not plain Esc, which TUIs need) returns to navigate.
    const keybuf = document.querySelector('key-buffer');
    const badge = document.getElementById('mode-badge');
    let mode = 'navigate';
    function setMode(m) {
      mode = m;
      document.body.classList.toggle('mode-focus', m === 'focus');
      document.body.classList.toggle('mode-navigate', m === 'navigate');
      keybuf.setAttribute('enabled', m === 'focus' ? 'true' : 'false');
      badge.textContent = m;
    }
    setMode('navigate');

    // Click on a pane focuses it: point key-buffer at the clicked sid right
    // away (the @post('/nav') firing alongside updates $selectedSid a
    // round-trip later) and enter focus mode so typing lands immediately.
    window.__focusSid = (sid) => {
      if (!sid) return;
      keybuf.setAttribute('sid', sid);
      setMode('focus');
    };

    // Combo normalization. macOS substitutes a glyph for e.key when Alt is
    // held (option+d -> the partial-derivative sign); fall back to e.code
    // (KeyD -> "d") so alt+letter combos still match.
    function comboKey(e) {
      const parts = [];
      if (e.metaKey) parts.push('cmd');
      if (e.ctrlKey) parts.push('ctrl');
      if (e.altKey) parts.push('alt');
      if (e.shiftKey) parts.push('shift');
      let k = e.key;
      if (e.altKey && e.code && e.code.startsWith('Key')) {
        k = e.code.slice(3).toLowerCase();
      } else if (k.length === 1 && /[a-zA-Z]/.test(k)) {
        k = k.toLowerCase();
      } else if (k === ' ') {
        k = 'space';
      }
      parts.push(k.toLowerCase());
      return parts.join('+');
    }
    function readJson(name) {
      const raw = document.body.dataset[name];
      if (!raw) return {};
      try { return JSON.parse(raw); } catch { return {}; }
    }
    // Capture-phase keymap. A matched combo calls stopPropagation so it never
    // reaches key-buffer's window (bubble-phase) listener. The active set of
    // combos is mode-scoped:
    //   navigate -- the full keymap (Alt+T/D/J/K/R, Enter to focus).
    //   focus    -- only Alt+Esc (back to navigate); everything else, plain
    //               Esc included, falls through to the pty.
    // The modal-input guard keeps the rename field's own Enter/Esc/typing.
    document.addEventListener('keydown', (e) => {
      if (document.activeElement?.classList.contains('modal-input')) return;
      const combo = comboKey(e);
      if (mode === 'focus') {
        if (combo === 'alt+escape') {
          e.preventDefault();
          e.stopPropagation();
          setMode('navigate');
        }
        return;
      }
      const id = readJson('keymap')[combo];
      if (!id) return;
      const js = readJson('actions')[id];
      if (!js) return;
      e.preventDefault();
      e.stopPropagation();
      try { new Function(js)(); } catch (err) { console.error('action', id, err); }
    }, { capture: true });
  </script>
</body>
</html>
