<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title or "ghostty-web-nu sessions" }}</title>
  <script type="module" src="{{ datastar_js_path }}"></script>
  <style>
    :root {
      --bg: #1e1e1e; --fg: #d4d4d4;
      --pane: #161616; --pane-border: #2a2a2a;
      --sel: #2a9d4a; --sel-blur: #2d4f7c; --sel-fg: #ffffff; --dim: #888;
      --chrome: #252525;
    }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    body { display: grid; grid-template-columns: 14rem 1fr; height: 100dvh; }
    aside { background: var(--pane); border-right: 1px solid var(--pane-border); overflow-y: auto; min-height: 0; }
    aside header { padding: .4rem .5rem .4rem .75rem; border-bottom: 1px solid var(--pane-border); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; justify-content: space-between; }
    aside header .new-btn { background: transparent; color: inherit; border: 1px solid var(--pane-border); border-radius: 3px; padding: 0 .5rem; font: inherit; cursor: pointer; line-height: 1.4; }
    aside header .new-btn:hover { background: #222; color: var(--fg); }
    aside ul { list-style: none; margin: 0; padding: 0; }
    aside li { display: flex; align-items: stretch; border-bottom: 1px solid var(--pane-border); }
    aside li .row { flex: 1; min-width: 0; text-align: left; background: transparent; color: inherit; border: 0; padding: .4rem .75rem; font: inherit; cursor: pointer; overflow: hidden; }
    aside li .row:hover { background: #222; }
    aside li.selected .row { background: var(--sel-blur); color: var(--sel-fg); }
    body:has(.term-wrap:focus-within) aside li.selected .row { background: var(--sel); }
    aside li .close { flex: 0 0 auto; width: 1.75rem; background: transparent; color: inherit; border: 0; padding: 0; font: inherit; cursor: pointer; opacity: 0; transition: opacity .1s; }
    aside li:hover .close, aside li.selected .close { opacity: .6; }
    aside li .close:hover { opacity: 1; color: #ff7676; background: #222; }
    aside li small { display: block; font-size: 11px; opacity: .6; }
    /* main is a grid: topbar | (terminal + rightbar) | statusbar. The
       three chrome bars frame the terminal on top/right/bottom; the left
       edge is the sidebar border. The topbar shows the current window title
       (click or Alt+Shift+R to rename); the rightbar stays a cosmetic sliver. */
    main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; overflow: hidden; }
    .topbar {
      background: var(--chrome); padding: .15rem .75rem;
      display: flex; align-items: center;
      font-size: 11px; color: var(--dim);
    }
    .title-display {
      cursor: pointer; padding: 0 .25rem; border-radius: 2px;
    }
    .title-display:hover { background: #2f2f2f; color: var(--fg); }
    .middle { display: grid; grid-template-columns: 1fr 1ch; min-height: 0; }
    .term-wrap { position: relative; min-height: 0; overflow: hidden; transition: opacity .15s; }
    .term-wrap:not(:focus-within) { opacity: .55; }
    #terminal { position: absolute; inset: 0; }
    .rightbar { background: var(--chrome); }
    .statusbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2.5rem 1rem .75rem;
      background: var(--chrome); color: var(--fg);
      border-top: 1px solid var(--pane-border);
      font-size: 11px; line-height: 1;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    /* Rename modal. Backdrop is a fullscreen translucent overlay; the box
       floats near the top so it doesn't fight with the user's gaze on the
       sidebar / terminal. Click outside to cancel; Enter saves; Esc cancels.
       Pattern adapted from stacks.nu's three-pane rename dialog. */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0, 0, 0, 0.45);
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 6rem;
    }
    .modal-box {
      width: min(28rem, 90%);
      background: var(--pane);
      border: 1px solid var(--pane-border);
      border-radius: 4px;
      padding: .75rem 1rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .modal-heading {
      font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--dim); margin-bottom: .35rem;
    }
    .modal-input {
      width: 100%; background: transparent; border: 0; outline: none;
      color: var(--fg); font: inherit; font-size: 14px;
      padding: .25rem 0;
    }
  </style>
</head>
<body
  data-signals='{"selectedSid":"","connId":"","sid":"","sel":"","focusedDims":"","title":{{ title | default("") | tojson | e }},"renaming":false,"renameMode":"title","draft":"","label":""}'
  data-init="@get('/sse')"
  data-effect="document.title = $title || 'ghostty-web-nu sessions'"
  data-actions='{
    "new":       "window.app.newSession()",
    "close":     "window.app.closeSelected()",
    "next":      "window.app.cycle(1)",
    "prev":      "window.app.cycle(-1)",
    "rename":    "window.app.openRename()",
    "renameTab": "window.app.openRenameTab()"
  }'
  data-keymap='{
    "alt+t": "new",
    "alt+d": "close",
    "alt+j": "next",
    "alt+k": "prev",
    "alt+r": "renameTab",
    "alt+shift+r": "rename"
  }'
>
  <!-- Server overwrites this on every event. The initial placeholder
       just sits empty until the first patch lands. -->
  <aside id="sessions-list"><header>Sessions</header></aside>

  <main>
    <!-- Topbar shows the current server-wide title. Click (or Alt+Shift+R)
         opens the rename modal; the modal's draft signal stays separate from
         $title so Esc-to-cancel never disturbs the committed value. -->
    <div class="topbar">
      <span
        class="title-display"
        title="Rename (Alt+Shift+R)"
        data-text="$title || 'untitled'"
        data-on:click="$draft = $title; $renameMode = 'title'; $renaming = true"></span>
    </div>
    <div class="middle">
      <div class="term-wrap">
        <!-- datastar mirrors $selectedSid into data-sid; our JS observes the
             attribute change and swaps the EventSource. The terminal element
             itself is mounted once and reused. -->
        <div id="terminal" data-attr:data-sid="$selectedSid"></div>
      </div>
      <div class="rightbar"></div>
    </div>
    <!-- Status bar. Right-side text mirrors $focusedDims which the server
         patches whenever the focused session changes size or selection
         moves. -->
    <footer class="statusbar" aria-label="Status">
      <span></span>
      <span data-text="$focusedDims"></span>
    </footer>
  </main>

  <!-- Hidden trigger so the JS-only Alt+R action can seed signals through
       datastar's expression evaluator (the action handler is a `new Function`
       and can't touch signals directly). The action writes the current tab's
       label into el.dataset.label, then clicks; this expression copies it
       into $draft and opens the modal in tab mode. Same pattern as the
       topbar's title-display click handler. -->
  <button
    id="rename-tab-trigger"
    type="button"
    hidden
    data-on:click="$draft = el.dataset.label || ''; $renameMode = 'tab'; $renaming = true"></button>

  <!-- Rename modal. data-show toggles visibility via display:none; the input
       lives in the DOM permanently so a data-effect can re-focus + select-all
       whenever $renaming flips true. data-bind keeps the input value in
       $draft (a scratch signal). On Enter the dispatch branches on
       $renameMode: 'title' copies $draft into $title and POSTs /title;
       'tab' copies $draft into $label and POSTs /pty/label (the server reads
       $selectedSid + $label). Esc or clicking the backdrop cancels without
       committing. -->
  <div class="modal-backdrop" data-show="$renaming" data-on:click="$renaming = false">
    <div class="modal-box" data-on:click="evt.stopPropagation()">
      <div class="modal-heading" data-text="$renameMode === 'tab' ? 'Rename tab' : 'Rename window'"></div>
      <input
        type="text"
        class="modal-input"
        spellcheck="false"
        aria-label="rename"
        data-bind="draft"
        data-effect="$renaming && requestAnimationFrame(() => { el.focus(); el.setSelectionRange(0, el.value.length); })"
        data-on:keydown="if (evt.key === 'Enter') { if ($renameMode === 'tab') { $label = $draft; $renaming = false; @post('/pty/label') } else { $title = $draft; $renaming = false; @post('/title') } } else if (evt.key === 'Escape') { $renaming = false }">
    </div>
  </div>

  <script type="module">
    import { init, Terminal, FitAddon } from './ghostty-web.js';
    await init();

    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'ui-monospace, "SF Mono", Menlo, Consolas, monospace',
      theme: { background: '#1e1e1e', foreground: '#d4d4d4' },
      scrollback: 10000,
    });
    const fit = new FitAddon();
    term.loadAddon(fit);
    const container = document.getElementById('terminal');
    term.open(container);
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    fit.fit();

    // Hard-debounced fit on window resize (avoid per-frame WASM resize storm).
    let rt = null;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => fit.fit(), 200);
    });

    // Input -> /pty/input (keyed by currently-attached sid).
    //
    // Two strategies kept side-by-side so we can A/B the feel:
    //   sendInputDirect    -- one POST per keystroke. Default now that the
    //                         Rust fast-path makes /pty/input ~0ms server-
    //                         side; per-request HTTP framing is cheap
    //                         enough on localhost that no coalescing
    //                         earns its added latency.
    //   sendInputCoalesced -- trailing-edge 20ms timer; bursts collapse
    //                         into one POST. Sid captured at enqueue and
    //                         flushed from attachTo so a mid-window tab
    //                         switch can't ship old bytes to a new pty.
    //                         Swap term.onData below to feel-test.
    let currentSid = null;
    let currentEs = null;
    let inputBuf = '';
    let inputSid = null;
    let inputTimer = null;
    function flushInput() {
      inputTimer = null;
      if (!inputBuf || !inputSid) return;
      const body = inputBuf;
      const sid = inputSid;
      inputBuf = '';
      inputSid = null;
      fetch('/pty/input?sid=' + encodeURIComponent(sid), {
        method: 'POST',
        headers: { 'content-type': 'application/octet-stream' },
        body,
      }).catch(() => {});
    }
    function sendInputCoalesced(d) {
      inputBuf += d;
      inputSid = currentSid;
      if (!inputTimer) inputTimer = setTimeout(flushInput, 20);
    }
    function sendInputDirect(d) {
      fetch('/pty/input?sid=' + encodeURIComponent(currentSid), {
        method: 'POST',
        headers: { 'content-type': 'application/octet-stream' },
        body: d,
      }).catch(() => {});
    }
    term.onData((d) => {
      if (!currentSid) return;
      sendInputDirect(d);
    });

    // Resize -> /pty/resize
    let lastCols = term.cols, lastRows = term.rows;
    term.onResize(({ cols, rows }) => {
      if (!currentSid) return;
      if (cols === lastCols && rows === lastRows) return;
      lastCols = cols; lastRows = rows;
      fetch('/pty/resize?sid=' + encodeURIComponent(currentSid), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ cols, rows }),
      }).catch(() => {});
    });

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function attachTo(sid) {
      if (sid === currentSid) return;
      if (inputTimer) { clearTimeout(inputTimer); flushInput(); }
      if (currentEs) { try { currentEs.close(); } catch {} currentEs = null; }
      term.clear();
      currentSid = sid;
      if (!sid) return;
      // Force the pty's size to match the browser's term on attach. The
      // initial fit.fit() runs before term.onResize is registered, so the
      // resize-delta guard later never fires for the open-time dimensions.
      // Without this push, the pty stays at its 80x24 default while the
      // browser has grown to fit the viewport, and nu emits output sized
      // for a screen the user can't actually see (cursor reports diverge,
      // CUP positioning lands wrong, etc).
      lastCols = term.cols; lastRows = term.rows;
      fetch('/pty/resize?sid=' + encodeURIComponent(sid), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ cols: term.cols, rows: term.rows }),
      }).catch(() => {});
      const es = new EventSource('/pty/stream?sid=' + encodeURIComponent(sid));
      es.onmessage = (ev) => writePreservingScroll(b64ToBytes(ev.data));
      currentEs = es;
    }

    // ghostty-web's Terminal.write() force-scrolls to bottom on every call,
    // which yanks the user back the moment any output arrives if they're
    // trying to read scrollback. Preserve their position when they're
    // scrolled up; new lines append silently below the viewport. When
    // they're already at the bottom (viewportY === 0), leave the default
    // auto-scroll alone.
    function writePreservingScroll(bytes) {
      const wasScrolledUp = term.viewportY !== 0;
      const savedY = term.viewportY;
      const prevBacklog = term.getScrollbackLength?.() ?? 0;
      term.write(bytes);
      if (wasScrolledUp) {
        const delta = (term.getScrollbackLength?.() ?? 0) - prevBacklog;
        term.scrollToLine(savedY + delta);
      }
    }

    // datastar mirrors the $selectedSid signal onto the #terminal element's
    // data-sid attribute (via data-attr:data-sid). MutationObserver picks up
    // the change and triggers an EventSource swap.
    const mo = new MutationObserver(() => {
      const sid = container.getAttribute('data-sid') || '';
      attachTo(sid);
    });
    mo.observe(container, { attributes: true, attributeFilter: ['data-sid'] });
    queueMicrotask(() => {
      const sid = container.getAttribute('data-sid') || '';
      if (sid) attachTo(sid);
    });

    // Action registry. Actions are JS strings keyed by id; data-actions
    // on <body> maps id -> JS, data-keymap maps combo -> id. The handler
    // below evaluates the JS string for the matched action.
    window.app = {
      newSession() {
        document.querySelector('#sessions-list .new-btn')?.click();
      },
      closeSelected() {
        if (!currentSid) return;
        fetch('/pty/close?sid=' + encodeURIComponent(currentSid), { method: 'POST' }).catch(() => {});
      },
      cycle(dir) {
        const items = [...document.querySelectorAll('#sessions-list li')];
        if (!items.length) return;
        const idx = items.findIndex((li) => li.classList.contains('selected'));
        const next = items[((idx < 0 ? 0 : idx) + dir + items.length) % items.length];
        next.querySelector('.row')?.click();
      },
      openRename() {
        // Action handlers are raw JS strings (new Function), so they can't
        // touch datastar signals directly. Re-fire a click on the topbar's
        // title-display, whose data-on:click expression seeds $draft from
        // $title and flips $renaming -- letting datastar own the signal
        // mutation path.
        document.querySelector('.title-display')?.click();
      },
      openRenameTab() {
        // Read the selected tab's current label out of the rendered list.
        // The button's first child is the label text node; the <small> sid
        // suffix is a sibling, so firstChild.textContent gives us just the
        // label. Stash it on the hidden trigger's dataset and click -- the
        // trigger's data-on:click copies dataset.label into $draft and opens
        // the modal in tab mode (mirrors the title-display click pattern).
        const btn = document.querySelector('#sessions-list li.selected .row');
        if (!btn) return;
        const label = btn.firstChild?.textContent?.trim() ?? '';
        const trig = document.getElementById('rename-tab-trigger');
        if (!trig) return;
        trig.dataset.label = label;
        trig.click();
      },
    };

    // Combo normalization. macOS substitutes a unicode glyph for e.key when
    // Alt is held (option+d -> ∂); fall back to e.code (KeyD) -> "d" so
    // alt+letter combos still match.
    function comboKey(e) {
      const parts = [];
      if (e.metaKey) parts.push('cmd');
      if (e.ctrlKey) parts.push('ctrl');
      if (e.altKey) parts.push('alt');
      if (e.shiftKey) parts.push('shift');
      let k = e.key;
      if (e.altKey && e.code && e.code.startsWith('Key')) {
        k = e.code.slice(3).toLowerCase();
      } else if (k.length === 1 && /[a-zA-Z]/.test(k)) {
        k = k.toLowerCase();
      } else if (k === ' ') {
        k = 'space';
      }
      parts.push(k.toLowerCase());
      return parts.join('+');
    }
    function readJson(name) {
      const raw = document.body.dataset[name];
      if (!raw) return {};
      try { return JSON.parse(raw); } catch { return {}; }
    }
    // Capture-phase so we beat ghostty-web's canvas handler to the chord.
    document.addEventListener('keydown', (e) => {
      // While the rename modal owns focus, its input handles Enter/Esc/typing
      // itself -- don't pull Alt+R/J/K/etc out from under the user.
      if (document.activeElement?.classList.contains('modal-input')) return;
      // Enter pressed outside the terminal redirects focus into it -- lets
      // the user return from sidebar buttons without reaching for the mouse.
      if (e.key === 'Enter' && !container.contains(document.activeElement)) {
        e.preventDefault();
        e.stopPropagation();
        term.focus();
        return;
      }
      const id = readJson('keymap')[comboKey(e)];
      if (!id) return;
      const js = readJson('actions')[id];
      if (!js) return;
      e.preventDefault();
      e.stopPropagation();
      try { new Function(js)(); } catch (err) { console.error('action', id, err); }
    }, { capture: true });
  </script>
</body>
</html>
