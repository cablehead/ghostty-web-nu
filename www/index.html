<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>ghostty-web-nu</title>
  <link rel="stylesheet" href="/stellar.css">
  <link rel="stylesheet" href="/term.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.1/bundles/datastar.js"></script>
  <script type="module" src="/key-buffer.js"></script>
</head>
<body
  data-signals="{sid: ''}"
  data-on:sid-ready__window="$sid = evt.detail.sid"
  data-effect="$sid && @get('/pty/view?sid=' + $sid, {openWhenHidden: true})"
>
  <div id="status">connecting...</div>
  <div id="grid"></div>
  <key-buffer data-attr:sid="$sid"></key-buffer>

  <script type="module">
    // Wait for the @font-face Inconsolata to actually arrive before probing
    // the cell. Otherwise we measure the fallback (Monaco) and the server
    // gets cols/rows that don't match what fits.
    await document.fonts.ready;

    function measureCell() {
      const probe = document.createElement('span');
      probe.className = 'cell-probe';
      probe.textContent = 'M'.repeat(80);
      document.body.appendChild(probe);
      const rect = probe.getBoundingClientRect();
      probe.remove();
      return { w: rect.width / 80, h: rect.height };
    }

    function viewportCells(cell) {
      return {
        cols: Math.max(20, Math.floor(window.innerWidth / cell.w)),
        rows: Math.max(5, Math.floor(window.innerHeight / cell.h)),
      };
    }

    const status = document.getElementById('status');
    const grid = document.getElementById('grid');

    // Live status: reads dims off the grid itself. Updates whenever the
    // server emits a new frame whose data-cols/data-rows differ from the
    // last one. This is what the user sees during a resize -- the moment
    // the server acks the new size, the status text changes.
    let lastDims = '';
    function syncStatus() {
      const c = grid.dataset.cols || '?';
      const r = grid.dataset.rows || '?';
      const dims = `${c}x${r}`;
      if (dims !== lastDims) {
        lastDims = dims;
        const sidPart = window.__sid ? window.__sid.slice(0, 8) : '';
        status.textContent = sidPart ? `sid ${sidPart} (${dims})` : `(${dims})`;
      }
    }
    new MutationObserver(syncStatus).observe(grid, {
      attributes: true,
      attributeFilter: ['data-cols', 'data-rows'],
    });

    // Mirror the pty's OSC 0/2 title into document.title. Empty string means
    // nothing's set; fall back to the page's default in that case.
    const defaultTitle = document.title;
    function syncTitle() {
      const t = grid.dataset.title || '';
      const next = t ? t : defaultTitle;
      if (document.title !== next) document.title = next;
    }
    new MutationObserver(syncTitle).observe(grid, {
      attributes: true,
      attributeFilter: ['data-title'],
    });

    // Auto-stick-to-bottom: when the user is at (or near) the bottom of the
    // scrollback and a new frame morphs in, snap to the bottom so the live
    // tail stays visible. When they've scrolled up, leave the position alone
    // -- new output accumulates below the visible viewport until they
    // scroll back to the bottom.
    //
    // Distinguishing "user scrolled" from "we scrolled" is done with a
    // suppression flag set immediately before the programmatic scrollTop
    // write. The scroll event fires synchronously from that write, so the
    // flag is reliably consumed before any user scroll could arrive.
    let stickToBottom = true;
    let suppressNextScroll = false;
    grid.addEventListener('scroll', () => {
      if (suppressNextScroll) {
        suppressNextScroll = false;
        return;
      }
      stickToBottom = grid.scrollHeight - grid.scrollTop - grid.clientHeight < 8;
    });
    new MutationObserver(() => {
      if (stickToBottom && grid.scrollTop !== grid.scrollHeight - grid.clientHeight) {
        suppressNextScroll = true;
        grid.scrollTop = grid.scrollHeight;
      }
    }).observe(grid, { childList: true, subtree: true, characterData: true });

    let cell = measureCell();
    const initial = viewportCells(cell);

    // Reattach to the prior sid on refresh. sessionStorage scopes to this
    // tab, so a refresh hits the same pty while a new tab gets its own.
    // The probe is POST /pty/resize -- a 204 means the sid is alive AND
    // the dims are updated to the current viewport in one round trip; any
    // other status (404/500 from the server when the sid is unknown) means
    // we need to mint a fresh one.
    let sid = sessionStorage.getItem('sid');
    let reattached = false;
    if (sid) {
      status.textContent = `reattaching ${sid.slice(0, 8)}...`;
      try {
        const r = await fetch('/pty/resize?sid=' + encodeURIComponent(sid), {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(initial),
        });
        reattached = r.status === 204;
      } catch {}
      if (!reattached) {
        sessionStorage.removeItem('sid');
        sid = null;
      }
    }
    if (!sid) {
      status.textContent = `requesting ${initial.cols}x${initial.rows}...`;
      try {
        const r = await fetch('/pty/create', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(initial),
        });
        ({ sid } = await r.json());
        sessionStorage.setItem('sid', sid);
      } catch (e) {
        status.textContent = 'pty/create failed: ' + e.message;
        throw e;
      }
    }
    window.__sid = sid;
    syncStatus();
    window.dispatchEvent(new CustomEvent('sid-ready', { detail: { sid } }));

    // Re-measure on every resize -- catches browser zoom changes and any
    // font-metric oddities that show up at different viewport sizes.
    let resizeTimer;
    let lastSent = `${initial.cols}x${initial.rows}`;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(async () => {
        cell = measureCell();
        const { cols, rows } = viewportCells(cell);
        const key = `${cols}x${rows}`;
        if (key === lastSent) return;
        lastSent = key;
        try {
          await fetch('/pty/resize?sid=' + encodeURIComponent(sid), {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ cols, rows }),
          });
        } catch {}
      }, 80);
    });
  </script>
</body>
</html>
